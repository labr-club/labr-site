# Redraws public/og.png (the link-preview image) whenever og/og.html changes.
name: og-image
on:
  push:
    branches: [main]
    paths: ["og/**"]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render og/og.html to public/og.png
        run: |
          google-chrome --headless=new --disable-gpu --hide-scrollbars --force-device-scale-factor=1 \
            --window-size=1200,630 --virtual-time-budget=10000 \
            --screenshot="$PWD/public/og.png" "file://$PWD/og/og.html"
          file public/og.png | grep -q "PNG image data, 1200 x 630"
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/og.png
          git diff --cached --quiet || { git commit -m "Redraw link-preview image"; git push; }
